<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Source for feature-graphic-1024x500.png. Screenshot this page at 1024x500
  (no scrollbars, device pixel ratio 1) after editing the copy.
-->
<style>
html,body{margin:0;padding:0}
body{width:1024px;height:500px;overflow:hidden;font-family:"DejaVu Sans","Liberation Sans",sans-serif;
 background:radial-gradient(circle at 22% 50%,#123A38 0%,#0F172A 45%,#0B1220 100%);color:#F0F6FC;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(52,211,153,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(52,211,153,.06) 1px,transparent 1px);background-size:40px 40px}
.icon{position:absolute;left:60px;top:90px;width:320px;height:320px;border-radius:72px;overflow:hidden;
 box-shadow:0 0 60px rgba(34,211,238,.35)}
.icon img{display:block;width:100%;height:100%}
.text{position:absolute;left:410px;top:0;bottom:0;right:50px;display:flex;flex-direction:column;justify-content:center}
h1{margin:0;font-size:54px;font-weight:700;letter-spacing:-1px;line-height:1.05}
h1 span{color:#34D399}
p{margin:18px 0 26px;font-size:25px;line-height:1.35;color:#C9D1D9}
.chips{display:flex;gap:9px}
.chip{white-space:nowrap;border:1.5px solid rgba(52,211,153,.55);color:#D8FFEE;border-radius:999px;
 padding:7px 16px;font-size:17px;background:rgba(52,211,153,.08)}
</style>
</head>
<body>
<div class="grid"></div>
<div class="icon"><img src="app-icon-512.png" alt="PackaTrack"></div>
<div class="text">
  <h1>Packa<span>Track</span></h1>
  <p>Renumbering, consolidation and<br>multi-courier tracking, handled.</p>
  <div class="chips">
    <div class="chip">Renumbering</div>
    <div class="chip">Consolidation</div>
    <div class="chip">Multi-courier</div>
  </div>
</div>
</body>
</html>
