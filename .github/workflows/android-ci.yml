name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

# Let the test-report step publish a check with annotations.
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          # Refresh cmdline-tools so the newest platforms are visible, then accept licenses.
          sdkmanager --install "cmdline-tools;latest" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools"
          # The androidx/compose/coil deps require compileSdk 37. Try the stable channel
          # first, then preview channels in case API 37 ships there on this runner image.
          install_pkg() {
            for ch in "" "--channel=1" "--channel=2" "--channel=3"; do
              if sdkmanager $ch "$1"; then return 0; fi
            done
            return 1
          }
          install_pkg "platforms;android-37"
          install_pkg "build-tools;37.0.0" || echo "build-tools 37.0.0 unavailable; relying on preinstalled"
          sdkmanager --list_installed || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run core unit tests
        run: ./gradlew :core:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish unit-test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/test*UnitTest/TEST-*.xml'
          check_name: Unit test report
          include_passed: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
