name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

# Let the test-report step publish a check with annotations.
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The current AndroidX/Compose dependencies require compileSdk 37. setup-android v4
      # resolves the published Android 17 platform as platforms;android-37.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run core unit tests
        run: ./gradlew :core:testDebugUnitTest --stacktrace

      - name: Debug - List test results
        if: always()
        run: find . -name "*.xml" | grep test-results || echo "No XML files found"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Publish unit-test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test*UnitTest/TEST-*.xml'
          check_name: Unit test report
          include_passed: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            core/build/test-results/**/*.xml
            app/build/test-results/**/*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
