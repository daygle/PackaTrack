name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify the integrity of the Gradle Wrapper to prevent supply chain attacks.
  validation:
    name: Gradle Wrapper Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4

  # Main build pipeline: Lint, Test, and Build.
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Sets up the Android SDK environment.
      # We omit explicit 'packages' to allow AGP to auto-provision the correct SDK versions (e.g., API 37).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Official Gradle Action for robust caching and build insights.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Run Static Analysis and Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish Unit Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test*UnitTest/TEST-*.xml'
          check_name: Unit Test Report
          include_passed: true

      - name: Upload Reports and Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-and-results
          path: |
            **/build/reports/
            **/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
