name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify the integrity of the Gradle Wrapper to prevent supply chain attacks.
  validation:
    name: Gradle Wrapper Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  # Main build pipeline: Lint, Test, and Build.
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Sets up the Android SDK environment.
      # AGP auto-provisions the platform/build-tools it needs (e.g., API 37), but we must
      # override the action's default 'packages' input ('tools platform-tools'): the obsolete
      # 'tools' package was removed from Google's SDK repository, so the default install now
      # fails with "Failed to find package 'tools'".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Official Gradle Action for robust caching and build insights.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Run Static Analysis and Unit Tests
        id: run-tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish Unit Test Report
        # Only publish when tests actually ran (passed or failed with results); skip when
        # the build died before tests ran (e.g. compile error) so we don't post an empty check.
        if: always() && (steps.run-tests.outcome == 'success' || steps.run-tests.outcome == 'failure')
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test*UnitTest/TEST-*.xml'
          check_name: Unit Test Report
          include_passed: true
          require_tests: false

      - name: Upload Reports and Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-and-results
          path: |
            **/build/reports/
            **/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Room Schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          # AppDatabase lives in :data, which exports schemas to data/schemas (see the
          # room { schemaDirectory(...) } block in data/build.gradle.kts).
          path: data/schemas/
          if-no-files-found: error

  # Runs the androidTest suite on an emulator: exercises the SQLCipher/Keystore
  # database and the backup export/import round-trip, which JVM unit tests cannot.
  instrumented-test:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Override the action's default 'packages' ('tools platform-tools'); the obsolete
      # 'tools' package was removed from Google's SDK repository (see build-and-test job).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      # KVM is required for hardware-accelerated emulators on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # GPU mode is an emulator flag, not an action input: there is no `gpu` input, so the earlier
      # attempts to set it produced only GitHub's "Unexpected input(s) 'gpu'" warning and the
      # emulator kept launching with the action's default `-gpu swiftshader_indirect`, which
      # current emulator builds no longer offer (`emulator -help-gpu` lists auto, host, software,
      # lavapipe, swiftshader, swangle). `software` still left the headless runner unable to
      # obtain colour buffers ("Failed to find ColorBuffer" / "invalid color buffer"), so use the
      # SwiftShader renderer the emulator ships in lib64/gles_swiftshader and lib64/vulkan.
      # `emulator-options` replaces the action's defaults, hence repeating the rest here.
      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # Dump the JUnit XML inside this step, while the emulator and the results directory are
          # still alive: the per-test report is otherwise only a downloadable artifact, so a red
          # job says "there were failing tests" without naming any of them.
          script: |
            EXIT=0
            ./gradlew :app:connectedDebugAndroidTest --stacktrace || EXIT=$?
            find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} \; || true
            exit $EXIT

      # Belt and braces for the dump above: always show what was produced, and never let this step
      # itself fail the job.
      - name: Print Instrumented Test Results
        if: always()
        run: |
          ls -R app/build/outputs/androidTest-results || true
          find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} + || true

      - name: Upload Instrumented Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
