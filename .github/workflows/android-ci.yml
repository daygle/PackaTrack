name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify the integrity of the Gradle Wrapper to prevent supply chain attacks.
  validation:
    name: Gradle Wrapper Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4

  # Main build pipeline: Lint, Test, and Build.
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Sets up the Android SDK environment.
      # We omit explicit 'packages' to allow AGP to auto-provision the correct SDK versions (e.g., API 37).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Official Gradle Action for robust caching and build insights.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Run Static Analysis and Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish Unit Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test*UnitTest/TEST-*.xml'
          check_name: Unit Test Report
          include_passed: true

      - name: Upload Reports and Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-and-results
          path: |
            **/build/reports/
            **/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Room Schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

  # Runs the androidTest suite on an emulator: exercises the SQLCipher/Keystore
  # database and the backup export/import round-trip, which JVM unit tests cannot.
  instrumented-test:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # KVM is required for hardware-accelerated emulators on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Instrumented Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: warn
