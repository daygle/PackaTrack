name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

# Let the test-report step publish a check with annotations.
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          # The runner's preinstalled sdkmanager only understands SDK repo XML v3, but Google
          # now serves v4 — so it can't see android-37. Install the newest cmdline-tools (it
          # may land in a 'latest-2' dir when 'latest' preexists) and use that newer binary.
          sdkmanager --install "cmdline-tools;latest" > /dev/null 2>&1 || true
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
          [ -x "$SDKM" ] || SDKM="sdkmanager"
          echo "Using sdkmanager: $SDKM"; "$SDKM" --version || true
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # compileSdk 37 is required by the androidx/compose/coil deps.
          "$SDKM" "platform-tools" "platforms;android-37"
          "$SDKM" "build-tools;37.0.0" || echo "build-tools 37.0.0 unavailable; relying on preinstalled"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run core unit tests
        run: ./gradlew :core:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish unit-test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/test*UnitTest/TEST-*.xml'
          check_name: Unit test report
          include_passed: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
